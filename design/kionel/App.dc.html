<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; background: #FBFAF7; color: #111318;
      font-family: "IBM Plex Sans", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #1B3A63; text-decoration: none; } a:hover { color: #0E2440; }
    @keyframes pulse { 0%, 100% { opacity: .35 } 50% { opacity: 1 } }
    .live { animation: pulse 1.8s ease-in-out infinite; }
    .act { transition: transform .16s cubic-bezier(.22,.68,.28,1), box-shadow .16s cubic-bezier(.22,.68,.28,1); }
    .act--solid:active { transform: translate(2px, 2px); box-shadow: none; }
    .act--solid { box-shadow: 3px 3px 0 #C9C3B6; }
    .act--ghost { box-shadow: 3px 3px 0 #E3DFD6; }
    .act--ghost:active { transform: translate(2px, 2px); box-shadow: none; }
    @media (prefers-reduced-motion: reduce) { .live { animation: none } .act:active { transform: none } }
  </style>
</helmet>

<div style="display: flex; flex-direction: column; width: 390px; height: 844px; background: #FBFAF7; overflow: hidden;">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 18px 20px 14px; border-bottom: 1px solid #E3DFD6;">
    <div style="display: flex; align-items: center; gap: 9px;">
      <svg width="17" height="17" viewBox="0 0 64 64" aria-hidden="true">
        <path fill="#111318" d="M12 34h8v18h-8zm14-20h8v38h-8zm14 10h8v28h-8z"></path>
      </svg>
      <span style="font-size: 12px; font-weight: 600; letter-spacing: .2em;">KIONEL</span>
    </div>
    <div style="display: flex; align-items: center; gap: 7px;">
      <span class="live" style="width: 6px; height: 6px; background: #2E7D5B;"></span>
      <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 10px; letter-spacing: .1em; color: #5B6069;">RECEIVING</span>
    </div>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 18px; padding: 22px 20px 0;">

    <div>
      <h1 style="font-family: 'Source Serif 4', Georgia, serif; margin: 0 0 6px; font-size: 25px; font-weight: 600; letter-spacing: -.01em;">Confirm the channel</h1>
      <p style="margin: 0; font-size: 13.5px; line-height: 1.55; color: #5B6069;">Both codes must match on both devices before any data is accepted.</p>
    </div>

    <div style="display: flex; flex-direction: column; gap: 14px; padding: 20px 18px; background: #FFFFFF; border: 1px solid #E3DFD6;">
      <div>
        <div style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 10px; letter-spacing: .16em; color: #6E6A5E; margin-bottom: 9px;">FACTOR 1 &middot; DIGITS</div>
        <div style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 33px; font-weight: 500; letter-spacing: .14em; font-variant-numeric: tabular-nums;">573 921</div>
      </div>
      <div style="height: 1px; background: #EDEAE3;"></div>
      <div>
        <div style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 10px; letter-spacing: .16em; color: #6E6A5E; margin-bottom: 9px;">FACTOR 2 &middot; MARKS</div>
        <div style="display: flex; gap: 10px;">
          <span style="display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; border: 1px solid #D5D0C4; background: #FBFAF7;">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="7.5" stroke="#111318" stroke-width="1.8"></circle></svg>
          </span>
          <span style="display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; border: 1px solid #D5D0C4; background: #FBFAF7;">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 4.5 20 19H4z" stroke="#111318" stroke-width="1.8" stroke-linejoin="round"></path></svg>
          </span>
          <span style="display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; border: 1px solid #D5D0C4; background: #FBFAF7;">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 5h14v14H5z" fill="#111318"></path></svg>
          </span>
          <span style="display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; border: 1px solid #D5D0C4; background: #FBFAF7;">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3.5 20 8v8l-8 4.5L4 16V8z" stroke="#111318" stroke-width="1.8" stroke-linejoin="round"></path></svg>
          </span>
          <span style="display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; border: 1px solid #D5D0C4; background: #FBFAF7;">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 5l14 14M19 5 5 19" stroke="#111318" stroke-width="1.9" stroke-linecap="round"></path></svg>
          </span>
        </div>
      </div>
    </div>

    <div style="display: flex; gap: 10px; padding: 13px 15px; background: #F4F2ED; border-left: 2px solid #1B3A63;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px;">
        <circle cx="12" cy="12" r="9" stroke="#1B3A63" stroke-width="1.5"></circle>
        <path d="M12 11v5M12 8h.01" stroke="#1B3A63" stroke-width="1.8" stroke-linecap="round"></path>
      </svg>
      <p style="margin: 0; font-size: 12.5px; line-height: 1.55; color: #43474F;">If either code differs, a third key is between you. Stop and start over.</p>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 2px;">
      <div style="display: flex; align-items: baseline; justify-content: space-between;">
        <span style="font-size: 12.5px; color: #5B6069;">Incoming</span>
        <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; color: #43474F; font-variant-numeric: tabular-nums;">1.4 MB &middot; 812 blocks</span>
      </div>
      <div style="height: 5px; background: #E3DFD6; overflow: hidden;">
        <div style="width: 0%; height: 100%; background: #1B3A63;"></div>
      </div>
      <div style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 11px; color: #6E6A5E;">Waiting for confirmation</div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 11px; padding: 18px 20px 26px; border-top: 1px solid #E3DFD6; background: #FBFAF7;">
    <button class="act act--solid" style="height: 52px; border: 1px solid #111318; background: #111318; color: #FBFAF7; font-family: inherit; font-size: 15px; font-weight: 500; cursor: pointer;">Codes match &mdash; accept</button>
    <button class="act act--ghost" style="height: 52px; border: 1px solid #111318; background: #FBFAF7; color: #111318; font-family: inherit; font-size: 15px; font-weight: 500; cursor: pointer;">They differ &mdash; cancel</button>
  </div>
</div>
</x-dc>
</body>
</html>
